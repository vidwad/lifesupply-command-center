# LifeSupply Command Center — Render blueprint.
#
# Renders this file via "Blueprint" in the Render dashboard:
# https://render.com/docs/blueprint-spec
#
# Defines:
#   1. A Postgres database (with daily backups + PITR on the standard plan)
#   2. A web service running the Dockerfile (web + Playwright in one image)
#   3. A daily cron that prunes the audit log
#
# Secrets that can't be auto-generated (ANTHROPIC_API_KEY, RESEND_API_KEY,
# integration vault keys, etc.) are added manually in the dashboard after
# the blueprint applies. Run `MASTER_ENCRYPTION_KEY` and `AUTH_SECRET`
# generation locally with `openssl rand -base64 32` and paste them in.

databases:
  - name: lifesupply-cc-db
    databaseName: lifesupply_cc
    user: lifesupply_cc
    # Postgres plans use kebab-case slugs: basic-256mb ($6/mo, 256 MB
    # RAM, 1 GB storage), basic-1gb ($19/mo, 1 GB RAM, 5 GB storage),
    # pro-4gb ($95/mo) etc. Render's blueprint validator rejects the
    # underscore form. If basic-256mb is also rejected by your account
    # tier, check https://render.com/docs/blueprint-spec for the current
    # accepted slugs (Render updates them periodically).
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  # -------------------------------------------------------------------------
  # Web service — runs the Next.js app + Playwright in one container.
  # -------------------------------------------------------------------------
  - type: web
    name: lifesupply-cc-web
    runtime: docker
    plan: starter # $7/mo Starter; bump to standard ($25) for 2GB RAM
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      # ---- generated by Render at first apply ----
      - key: AUTH_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true

      # ---- pulled from the database service above ----
      - key: DATABASE_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString

      # ---- always set ----
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUDIT_RETENTION_DAYS
        value: "365"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ---- Inngest — background job queue ----
      # The web service SENDS events (BigCommerce sync triggers); the
      # worker below PROCESSES them. Publishing events only needs the
      # event key. Create an app at https://app.inngest.com and copy its
      # keys (Manage → Keys). sync:false = paste manually; not generated.
      # This MUST be set or sync buttons will dispatch into the void in
      # production.
      - key: INNGEST_EVENT_KEY
        sync: false

      # ---- domain-dependent: set after first deploy ----
      # AUTH_URL and NEXT_PUBLIC_APP_URL must match the public domain.
      # Add them in the Render dashboard once the service has a URL.
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # ---- AI provider — required for AI features ----
      - key: ANTHROPIC_API_KEY
        sync: false

      # ---- optional: investor-update email distribution ----
      - key: RESEND_API_KEY
        sync: false
      - key: INVESTOR_FROM_EMAIL
        sync: false
      - key: INVESTOR_FROM_NAME
        value: LifeSupply

      # ---- optional: BBM01 supplier portal — leave unset to use mock ----
      - key: SUPPLIER_PORTAL_BBM01_URL
        sync: false

  # -------------------------------------------------------------------------
  # Background worker — processes Inngest jobs (BigCommerce customer + order
  # sync). Uses the SAME Docker image as the web service; only the start
  # command differs. Connects OUT to Inngest via Connect (a persistent
  # WebSocket), so it needs no inbound URL, port, or health check — Render
  # keeps a Background Worker running without exposing it publicly.
  #
  # Without this service, the sync buttons create IntegrationSyncLog rows in
  # `running` state and send Inngest events that nothing ever handles, so
  # the logs hang forever. This service is what moves them to
  # success / partial / failed.
  # -------------------------------------------------------------------------
  - type: worker
    name: lifesupply-cc-worker
    runtime: docker
    plan: starter # $7/mo Starter; 0.5 CPU / 512 MB is enough for sync I/O
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    # Overrides the Dockerfile CMD (which runs migrations + `next start`).
    # The worker does not serve HTTP and must not run migrations — the web
    # service already applies them on deploy.
    dockerCommand: pnpm worker
    envVars:
      # ---- database (same instance as the web service) ----
      - key: DATABASE_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString

      # ---- vault master key ----
      # MUST equal the web service's MASTER_ENCRYPTION_KEY, or the worker
      # cannot decrypt BigCommerce credentials from the vault. The web
      # service generates this at first apply; copy that value here.
      # sync:false stops the blueprint from generating a second,
      # mismatched key.
      - key: MASTER_ENCRYPTION_KEY
        sync: false

      # ---- Inngest — same values as the web service ----
      # The worker registers functions and receives invocations over
      # Connect. It needs BOTH keys. Paste the same values used on
      # lifesupply-cc-web.
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false

      # ---- always set ----
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  # -------------------------------------------------------------------------
  # Cron — daily audit log retention sweep.
  # Runs at 03:15 UTC. The same logic backs the manual button at
  # /admin/audit-logs, so this just means the maintenance happens
  # automatically overnight.
  # -------------------------------------------------------------------------
  - type: cron
    name: lifesupply-cc-audit-retention
    runtime: docker
    plan: starter
    branch: main
    schedule: "15 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: pnpm tsx scripts/cron/audit-retention.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lifesupply-cc-db
          property: connectionString
      - key: AUDIT_RETENTION_DAYS
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
